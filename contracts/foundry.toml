[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

evm_version = "cancun"
optimizer = true
optimizer-runs = 200
solc = "0.8.29"
via_ir = false

[fmt]
# Never reformat vendored dependency source — `forge fmt` would otherwise walk lib/ and
# leave every submodule with a dirty working tree (whitespace-only edits, no SHA change).
# `src/interfaces/**` is vendored verbatim from Interfold so it can be diffed against upstream;
# reformatting it would create noise on every sync.
ignore = ["lib/**", "src/interfaces/**"]
line_length = 110
